spring:
  application:
    name: northstar-crm
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

northstar:
  security:
    jwt-secret: ${JWT_SECRET:lab-only-change-me-use-long-random-please}
    jwt-expiration-minutes: 60

logging:
  level:
    org.springframework.security: DEBUG
