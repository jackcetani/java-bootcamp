spring:
  datasource:
    url: jdbc:h2:mem:crmtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
logging:
  level:
    root: WARN
    com.northstar.crm: INFO
northstar:
  integration:
    api-key: "test-fixture-key"
    timeout-ms: 500