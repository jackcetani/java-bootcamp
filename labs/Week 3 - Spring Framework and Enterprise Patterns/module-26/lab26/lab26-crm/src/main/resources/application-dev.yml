spring:
  datasource:
    url: jdbc:h2:mem:crmdev;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    com.northstar.crm: DEBUG
    org.hibernate.SQL: DEBUG
northstar:
  integration:
    api-key: "dev-local-key-not-secret"
    timeout-ms: 3000